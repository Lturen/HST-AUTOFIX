<style>
body {
    background: linear-gradient(to bottom, #EFE6D5 0%, #423428 100%);
    background-attachment: fixed; /* Pitää taustan paikallaan rullatessa */
    height: 100vh;           /* Pakottaa bodyn vähintään näytön korkuiseksi */
    margin: 0;
}
header {
    display: flex;
}
.header-class {
    display: flex;
    gap: 15px; /* Väli logojen välille */
    flex : 1;
    padding: 1.24em;

}
header img {
    display: flex;
    gap: 15px; /* Väli logojen välille */
    flex : 1;
    padding: 1.24em;

}
header p {
    display: flex;
    text-align: center;
    margin-top: 1.3em;
    font-weight: bold;
    color: #423428;
    font-size: 1.8em;
}
header a {
    display: flex;
    margin-left: 2em;
    color: #423428;
    text-decoration: none; /* Poistaa alleviivauksen */
    font-size: 2.5em;      /* Voit säätää otsikon kokoa tästä */
    transition: all 0.9s ease;
}
header a:hover {
    opacity: 0.8;
}
nav {
    display: flex;
    justify-content: center;
    padding: 1em;
    
}
a  {
    color: #423428;
    text-decoration: none;
    margin: 0 10px;
    font-size: 1.9em;
    font-weight: bold;
    
}
.container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;

}
content {
    flex: 1;
}
.box {
    width: 100%;
    height: 10em;
    text-align: center;
    font-size: 2.5em;
}
footer {
    padding: 20px;
    text-align: center;
    color: #423428;
    /* Jos haluat footerin erottuvan, voit lisätä: */
    /* background: rgba(0,0,0,0.05); */
}
footer p {
    color: #423428;
    margin: 0;             /* Poistaa ylimääräiset tyhjät välit */
}



</style>
