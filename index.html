<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etusivu</title>
</head>
<style>
body {
    background: linear-gradient(to bottom, #EFE6D5 0%, #423428 100%);
    background-attachment: fixed; /* Pitää taustan paikallaan rullatessa */
    height: auto; 
    max-width: 100%; 
    margin: 0;
}
header {
    max-height: 120px;
    display: flex;
    align-items: center;
    justify-content: space-between;

}
.header-class, .empty-space {
    display: flex;
    gap: 15px; /* Väli logojen välille */
    flex : 1;
}
.header-center {
    display: flex;
    white-space: NOWRAP; /* Estää tekstin rivittymisen */
    flex : 0;
}
.empty-space {
    justify-content: flex-end; /* Tyhjää tilaa oikealle */
}
header img {
    display: flex;
    gap: 15px; /* Väli logojen välille */
    flex : 1;
    padding: 1.24em;

}
header p {
    display: flex;
    text-align: center;
    margin-top: 1.3em;
    font-weight: bold;
    color: #423428;
    font-size: 1.8em;
}
header a {
    display: flex;
    color: #423428;
    text-decoration: none;
    font-size: 2.5em; /* Huom: Tämä on todella suuri, voi rikkoa asettelun mobiilissa */
    transition: all 0.9s ease;
    margin-left: 0; /* Muuta tämä nollaksi */
}
header a:hover {
    opacity: 0.8;
}
nav {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 1em;
    background-color: #423428;
    
}
a  {
    color:#EFE6D5;
    text-decoration: none;
    margin: 0 10px;
    font-size: 1.9em;
    font-weight: bold;
    
}
.container {
    max-width: 1400px;
    margin: 0 auto; 
    width: 100%; /* Lisää tämä */
    box-sizing: border-box; /* Pitää paddingit laskuissa mukana */
}
.content {
    display: flex;
    flex-wrap: wrap; /* TÄRKEÄ: Sallii laatikoiden mennä päällekkäin kapealla ruudulla */
    padding: 2em;
    gap: 20px;
}
.box {
    flex : 1;
    min-width: 300px;
    text-align: left;
    font-size: 1.5em;
}
.tarjous-box {
    flex : 1;

}
img {
    max-width: 100%;
    height: auto;
}
footer {
    padding: 20px;
    text-align: center;
    color: #423428;
    /* Jos haluat footerin erottuvan, voit lisätä: */
    /* background: rgba(0,0,0,0.05); */
}
footer p {
    color: #423428;
    margin: 0;             /* Poistaa ylimääräiset tyhjät välit */
}



</style>
<body>
    <div class="container">
    <header>
        <div class="header-class">
        <a href = "https://www.facebook.com/p/HST-Autofix-61579099013716/" target="_blank">
        <img src="Facebook_Logo_Secondary.png" alt="Facebook-logo" style="width: 1.1em; height: 1.1em;">
        </a>
        <a href = "https://www.instagram.com/hstautofixsamppa/" target="_blank">
        <img src="Instagram_Glyph_Black.png" alt="Instagram-logo" style="width: 1.1em; height: 1.1em;">
        </a>
        </div>
            <div class="header-center">
                <p><a href="/index.html">HST-AUTOFIX</a></p>
            </div>
            <div class="empty-space">

            </div>
    
    </header>
    <nav>
        <div class="nav-item"><a href="/hinnasto/hinnasto.html">Hinnasto</a></div>
        <div class="nav-item"><a href="/yhteystiedot/yhteystiedot.html">Yhteystiedot</a></div>
        <div class="nav-item"><a href="/palvelut/palvelut.html">Palvelut</a></div>
    </nav>
    <div class="content">
        <div class="box">
            <h4 style="color: #423428;">Ajoneuvojen sekä moottoripyörien korjaamo/fiksaamo Tuusulantien päädyssä ja Järvenpääntien varrella.!</h4>
        </div>

        <div class="tarjous-box">
            <img src="tarjous.jpg" alt="Tarjouskuva"></img>
        </div>


    </div>
    <footer>
        <p>&copy; 2026 HST-AUTOFIX</p>
        <p style= "font-size: 2em; font-weight: bold;">hstautofixsamppa</p>
    </footer>
    </div>

</body>
</html>
